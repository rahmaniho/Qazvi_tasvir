<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061829" />
      <stop offset="50%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#0E4B6E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <radialGradient id="radialAmber" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radialSky" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotPattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#radialAmber)" />
  <rect width="1200" height="630" fill="url(#radialSky)" />
  <rect width="1200" height="630" fill="url(#dotPattern)" />

  <!-- Outer Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Left Content: Brand Emblem & Visual -->
  <g transform="translate(90, 110)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="410" height="410" rx="36" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    
    <!-- Big 31+ Badge -->
    <circle cx="205" cy="140" r="80" fill="url(#goldGrad)"/>
    <text x="205" y="150" font-family="'Vazirmatn', system-ui, sans-serif" font-size="56" font-weight="900" fill="#0A2540" text-anchor="middle">۳۱+ سال</text>
    <text x="205" y="185" font-family="'Vazirmatn', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0A2540" text-anchor="middle">تأسیس ۱۳۷۴ | شناسه: ۱۰۸۶۱۴۱۵۲۱۵</text>
    
    <!-- Dual services tags -->
    <rect x="35" y="250" width="340" height="42" rx="21" fill="#123A5E" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="205" y="277" font-family="'Vazirmatn', system-ui, sans-serif" font-size="15" font-weight="700" fill="#38BDF8" text-anchor="middle">🚢 بازرگانی، واردات و صادرات تخصصی</text>

    <rect x="35" y="305" width="340" height="42" rx="21" fill="#123A5E" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="205" y="332" font-family="'Vazirmatn', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FCD34D" text-anchor="middle">🚌 ترابری و سرویس پرسنل کارخانه‌ها</text>

    <rect x="35" y="360" width="340" height="34" rx="17" fill="rgba(255,255,255,0.06)"/>
    <text x="205" y="382" font-family="'Vazirmatn', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">شماره ثبت ۲۷۴۹ • کد اقتصادی ۴۱۱۳۸۶۸۳۷۶۶۵</text>
  </g>

  <!-- Right Content: Persian Text and Details (RTL layout) -->
  <g transform="translate(540, 120)">
    <!-- Pill Badge -->
    <rect x="230" y="0" width="380" height="38" rx="19" fill="rgba(245,158,11,0.15)" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="585" cy="19" r="5" fill="#F59E0B"/>
    <text x="390" y="25" font-family="'Vazirmatn', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FCD34D" text-anchor="middle">بیش از ۳۱ سال سابقه درخشان در خدمت صنعت کشور</text>

    <!-- Company Name Title -->
    <text x="610" y="95" font-family="'Vazirmatn', system-ui, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="end">شرکت قزوین تصویر</text>

    <!-- Subtitle -->
    <text x="610" y="150" font-family="'Vazirmatn', system-ui, sans-serif" font-size="26" font-weight="700" fill="#38BDF8" text-anchor="end">بازرگانی، واردات و صادرات • ترابری پرسنل صنعتی</text>

    <!-- Lead line -->
    <text x="610" y="200" font-family="'Vazirmatn', system-ui, sans-serif" font-size="18" font-weight="400" fill="#E2E8F0" text-anchor="end">مدیریت: سعید امین‌زاده | تأمین کالا، ترخیص گمرکی، ناوگان سازمانی</text>

    <!-- Address snippet -->
    <text x="610" y="235" font-family="'Vazirmatn', system-ui, sans-serif" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="end">قزوین، اول خیابان فردوسی، مجتمع تجاری آبادگران، طبقه ۶، اتاق ۶۰۴</text>

    <!-- Contact & Phone Info Bar -->
    <g transform="translate(130, 275)">
      <rect x="0" y="0" width="480" height="70" rx="35" fill="url(#goldGrad)"/>
      <text x="240" y="44" font-family="'Vazirmatn', 'Inter', system-ui, sans-serif" font-size="28" font-weight="900" fill="#0A2540" text-anchor="middle">تماس مستقیم: ۰۹۱۲ ۲۸۱ ۵۱۸۹</text>
    </g>
  </g>
</svg>