<?xml version="1.0" encoding="UTF-8"?>
<!--
  ایران خودرو دیزل (IKD) — نشان نمایندهٔ برند
  توجه: نشان رسمی IKD به‌صورت فایل وکتور در دسترس نیست؛ این طرح یک
  جایگزین گرافیکی است و برای جایگزینی، همین فایل را با لوگوی رسمی
  بازنویسی کنید (سایر چهار برند این بخش، نشان رسمی خود را دارند).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" width="200" height="110" role="img" aria-label="ایران خودرو دیزل">
  <title>ایران خودرو دیزل (IKD)</title>
  <defs>
    <linearGradient id="ikdBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7CC3"/>
      <stop offset="1" stop-color="#0A4E8C"/>
    </linearGradient>
  </defs>
  <!-- سپر شش‌ضلعی -->
  <path d="M100 8 L146 26 L146 62 L100 84 L54 62 L54 26 Z"
        fill="none" stroke="url(#ikdBlue)" stroke-width="5" stroke-linejoin="round"/>
  <!-- مونوگرام IKD -->
  <text x="100" y="53" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="27" font-weight="800" letter-spacing="3" fill="#FFFFFF">IKD</text>
  <path d="M74 60 H126" stroke="url(#ikdBlue)" stroke-width="3" stroke-linecap="round"/>
  <!-- نام برند -->
  <text x="100" y="102" text-anchor="middle"
        font-family="Vazirmatn, Tahoma, sans-serif"
        font-size="12.5" font-weight="700" fill="#CBD5E1">ایران خودرو دیزل</text>
</svg>
