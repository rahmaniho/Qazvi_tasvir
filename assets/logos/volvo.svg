<?xml version="1.0" encoding="UTF-8"?>
<!--
  لوگوی متنی (Text-based Wordmark) برند ولوو — طراحی اختصاصی قزوین تصویر
  توجه: بازتولید نشان رسمی تجاری شرکت سازنده نیست؛ وردمارک متنی جایگزین است.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" width="200" height="110" role="img" aria-label="ولوو">
  <title>ولوو (Volvo)</title>
  <!-- نشان اختصاصی: حلقه باز با نوار مورب رو به جلو (نماد ایمنی و حرکت) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
    <circle cx="100" cy="30" r="15" opacity="0.95"></circle>
    <path d="M112 19 L124 12" stroke="#FCD34D"></path>
  </g>
  <!-- نام برند -->
  <text x="100" y="82" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" letter-spacing="4" fill="#FFFFFF">VOLVO</text>
  <text x="100" y="99" text-anchor="middle"
        font-family="Vazirmatn, Tahoma, sans-serif"
        font-size="13" font-weight="600" fill="#94A3B8">ولوو • سوئد</text>
</svg>
