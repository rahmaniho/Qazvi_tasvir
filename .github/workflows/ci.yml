name: Validate site

# Quality gate only. Deployment stays with GitHub Pages' own branch build
# (Settings → Pages → Deploy from a branch), so this workflow never needs
# write access or repository secrets.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Python syntax
        run: python3 -m py_compile tools/*.py

      - name: JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/navigation.js
          node --check assets/js/service-pages.js
          node --check assets/js/menu.js
          node --check assets/js/dock.js
          node --check assets/js/hub.js
          node --check assets/js/contact.js

      - name: HTML structure
        run: python3 tools/check-html.py index.html en/index.html 404.html services/*.html

      - name: Links, anchors, metadata, JSON-LD, hreflang, sitemap
        run: python3 tools/check-site.py

      - name: Direction cascade (fa RTL / en LTR)
        run: python3 tools/check-css-direction.py

      - name: Translation coverage and freshness
        run: python3 tools/build-i18n-site.py --check

      - name: Generated service pages are up to date
        run: |
          python3 tools/build-service-pages.py
          git diff --exit-code -- services/
